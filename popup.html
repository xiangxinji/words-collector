<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Words Collector</title>
  <style>
    body { box-sizing: border-box; width: 340px; margin: 0; padding: 18px; font: 14px/1.5 system-ui, sans-serif; color: #202536; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    input { width: 18px; height: 18px; margin: 0; accent-color: #315dd1; }
    .hint { color: #5d6475; margin: 12px 0 0; }
    #status, #list-status, #translation-status { color: #ac2828; margin: 6px 0 0; }
    #status:empty, #list-status:empty, #translation-status:empty { display: none; }
    .translation-panel { margin-top: 18px; padding-top: 14px; border-top: 1px solid #e5e8ee; }
    .translation-panel h2 { margin-bottom: 8px; }
    .credential-field { display: block; margin-top: 10px; }
    .credential-field input { display: block; box-sizing: border-box; width: 100%; min-height: 38px; margin-top: 4px; padding: 8px; border: 1px solid #abb4c3; border-radius: 6px; font: inherit; }
    #save-credentials { min-height: 38px; margin-top: 10px; padding: 5px 12px; border: 0; border-radius: 6px; background: #315dd1; color: white; font: inherit; cursor: pointer; }
    #save-credentials:disabled { opacity: .6; cursor: wait; }
    .words-panel { margin-top: 18px; padding-top: 14px; border-top: 1px solid #e5e8ee; }
    .words-header { display: flex; align-items: baseline; justify-content: space-between; }
    h2 { margin: 0; font-size: 15px; }
    #word-count { color: #5d6475; font-size: 12px; }
    #word-list { max-height: 280px; overflow-y: auto; list-style: none; margin: 10px 0 0; padding: 0; }
    #word-list li { position: relative; min-height: 48px; padding: 8px 52px 8px 0; border-bottom: 1px solid #eff1f5; }
    #word-list li span { display: block; overflow-wrap: anywhere; }
    #word-list li span:nth-child(2) { margin-top: 3px; color: #5d6475; }
    #word-list button { position: absolute; right: 0; top: 50%; transform: translateY(-50%); min-width: 44px; min-height: 44px; border: 0; border-radius: 6px; padding: 8px; background: transparent; color: #a52a36; font: inherit; cursor: pointer; }
    #word-list button:hover { background: #fff0f1; }
    #word-list button:focus-visible { outline: 2px solid #315dd1; outline-offset: 2px; }
    #word-list button:disabled { opacity: .5; cursor: wait; }
    #empty-state { color: #5d6475; margin: 14px 0 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Words Collector</h1>
  <label for="collection-toggle">显示收集按钮 <input id="collection-toggle" type="checkbox" disabled></label>
  <p class="hint">开启后，双击或拖拽选中文字，再点旁边的「收集」按钮保存。</p>
  <p id="status" role="status" aria-live="polite"></p>
  <section class="translation-panel" aria-labelledby="translation-title">
    <h2 id="translation-title">百度翻译</h2>
    <label for="translation-toggle">收集时自动翻译成中文 <input id="translation-toggle" type="checkbox" disabled></label>
    <p class="hint">默认关闭。开启后，只有点击「收集」才会把本次原文发送给百度；翻译成功才保存。</p>
    <label class="credential-field" for="baidu-app-id">App ID <input id="baidu-app-id" type="text" autocomplete="off"></label>
    <label class="credential-field" for="baidu-secret">密钥 <input id="baidu-secret" type="password" autocomplete="new-password" placeholder="留空则保留已保存密钥"></label>
    <button id="save-credentials" type="button" disabled>保存凭据</button>
    <p id="translation-status" role="status" aria-live="polite"></p>
  </section>
  <section class="words-panel" aria-labelledby="words-title">
    <div class="words-header"><h2 id="words-title">已收集</h2><span id="word-count"></span></div>
    <ul id="word-list"></ul>
    <p id="empty-state" hidden>还没有收集文字。去网页双击选词试试吧。</p>
    <p id="list-status" role="status" aria-live="polite"></p>
  </section>
  <script src="popup.js"></script>
</body>
</html>
