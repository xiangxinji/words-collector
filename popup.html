<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Words Collector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <span class="brand-mark" aria-hidden="true">W</span>
      <div>
        <h1>Words Collector</h1>
        <p>随手收集，随时查看</p>
      </div>
    </header>

    <section class="panel collection-panel" aria-labelledby="collection-title">
      <label class="setting-row" for="collection-toggle">
        <span id="collection-title" class="setting-title">显示收集按钮</span>
        <input id="collection-toggle" type="checkbox" role="switch" aria-describedby="collection-hint" disabled>
      </label>
      <p id="collection-hint" class="hint">在网页双击或划选文字，点击选区旁的「收集」保存。</p>
      <p id="status" class="feedback" role="status" aria-live="polite"></p>
    </section>

    <section class="panel words-panel" aria-labelledby="words-title">
      <div class="words-header">
        <h2 id="words-title">已收集</h2>
        <div class="words-actions"><span id="word-count" aria-live="polite"></span><button id="export-words" type="button" disabled>导出 CSV</button><button id="import-words" type="button" disabled>导入 CSV</button><input id="import-file" type="file" accept=".csv,text/csv" hidden></div>
      </div>
      <ul id="word-list"></ul>
      <p id="empty-state" hidden>还没有收集文字。<br>去网页选个词试试吧。</p>
      <p id="list-status" class="feedback" role="status" aria-live="polite"></p>
      <p id="import-status" class="feedback" role="status" aria-live="polite"></p>
    </section>

    <section class="panel translation-panel" aria-labelledby="translation-title">
      <div class="section-heading">
        <h2 id="translation-title">百度翻译</h2>
        <span class="optional">可选</span>
      </div>
      <label class="setting-row" for="translation-toggle">
        <span class="setting-title">收集时翻译成中文</span>
        <input id="translation-toggle" type="checkbox" role="switch" aria-describedby="translation-hint" disabled>
      </label>
      <p id="translation-hint" class="hint">只有点击「收集」才会把本次原文发送给百度；翻译成功才保存。</p>
      <details class="credentials">
        <summary>配置百度凭据</summary>
        <div class="credential-fields">
          <label class="credential-field" for="baidu-app-id">App ID
            <input id="baidu-app-id" type="text" autocomplete="off">
          </label>
          <label class="credential-field" for="baidu-secret">密钥
            <input id="baidu-secret" type="password" autocomplete="new-password" placeholder="留空则保留已保存密钥">
          </label>
          <button id="save-credentials" type="button" disabled>保存凭据</button>
        </div>
      </details>
      <p id="translation-status" class="feedback" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
